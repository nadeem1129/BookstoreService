server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:bookstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false
      path: /h2-console

app:
  security:
    jwt:
      secret: ${JWT_SIGNING_SECRET}
      expiration-ms: 3600000 # 1 hour in milliseconds
  cors:
    allowed-origins: "http://localhost:3000"

logging:
  level:
    com.bookstore: INFO
    org.springframework.security: WARN